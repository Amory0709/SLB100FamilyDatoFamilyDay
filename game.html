<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Page — Step 1: 灯光测试</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #viewport { position: absolute; inset: 0; }
  #tag {
    position: absolute; top: 14px; left: 14px; z-index: 10;
    background: rgba(255,255,255,0.75); backdrop-filter: blur(8px);
    padding: 8px 12px; border-radius: 8px; font-size: 12px; color: #2a2a2a;
    border: 1px solid rgba(0,0,0,0.06); letter-spacing: 0.3px;
  }
  #tag b { color: #0040ff; }
  #hint {
    position: absolute; bottom: 14px; left: 14px; z-index: 10;
    font-size: 11px; color: #888; letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div id="viewport"></div>
<div id="tag">step <b>1</b> / n &nbsp;·&nbsp; 灯光测试 — 还没加载模型</div>
<div id="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
// CRITICAL: 保持颜色脆，不要被 tone-map 灰化
renderer.toneMapping = THREE.NoToneMapping;
// 软阴影（参考图的"软影棚拍"质感）
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('viewport').appendChild(renderer.domElement);

// ---------- Scene ----------
const scene = new THREE.Scene();

// 背景：摄影棚软光影 — 三层叠加（基础灰 + 中央软光 + 顶部雾化）
function makeGradientBg() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const ctx = c.getContext('2d');

  // ① 基础中灰 — 背景主调
  ctx.fillStyle = '#d6dade';
  ctx.fillRect(0, 0, 1024, 1024);

  // ② 中央软光晕（柔光箱效果）— 从下中略偏，辐射衰减
  const glow = ctx.createRadialGradient(512, 620, 60, 512, 620, 820);
  glow.addColorStop(0.00, 'rgba(252, 253, 254, 1.00)');
  glow.addColorStop(0.35, 'rgba(238, 241, 244, 0.55)');
  glow.addColorStop(0.75, 'rgba(214, 218, 222, 0.10)');
  glow.addColorStop(1.00, 'rgba(214, 218, 222, 0.00)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, 1024, 1024);

  // ③ 顶部雾化层 — 冷色薄雾，营远雾感
  const haze = ctx.createLinearGradient(0, 0, 0, 1024);
  haze.addColorStop(0.00, 'rgba(150, 158, 166, 0.18)');
  haze.addColorStop(0.45, 'rgba(150, 158, 166, 0.00)');
  haze.addColorStop(1.00, 'rgba(255, 255, 255, 0.06)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, 0, 1024, 1024);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}
scene.background = makeGradientBg();

// 雾：远处淡入背景主色（注意是基础中灰，不是中间软光）
scene.fog = new THREE.Fog(0xd6dade, 18, 60);

// ---------- Camera ----------
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(7, 5, 9);
camera.lookAt(0, 0, 0);

// ---------- Lights（建筑白模 — 软影棚拍，有轮廓）----------
// Hemi: 顶亮底略冷（弱）
const hemi = new THREE.HemisphereLight(0xffffff, 0xe8ebee, 1.0);
scene.add(hemi);

// Ambient: 中等 flat 补光（不能太高，否则模型变纸片）
const ambient = new THREE.AmbientLight(0xffffff, 0.42);
scene.add(ambient);

// Key light: 上方偏右前 — 强度回升、影子软一档
const key = new THREE.DirectionalLight(0xffffff, 1.25);
key.position.set(4, 12, 5); // 上方偏右前 → 影子落左后
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 40;
key.shadow.camera.left   = -14;
key.shadow.camera.right  =  14;
key.shadow.camera.top    =  14;
key.shadow.camera.bottom = -14;
key.shadow.bias = -0.0005;
key.shadow.radius = 6; // 中等软笔触 — 能看见形状但不硬
key.shadow.blurSamples = 25;
scene.add(key);

// 补光（对角，强度调低 — 让阴影侧明显暗一档，制造轮廓感）
const fill = new THREE.DirectionalLight(0xffffff, 0.2);
fill.position.set(-6, 4, -3);
scene.add(fill);

// 弱顶背光（rim）— 让物件背缘有轻微高光 = 轮廓清昕
const rim = new THREE.DirectionalLight(0xffffff, 0.35);
rim.position.set(-3, 6, -8); // 后左上方
scene.add(rim);

// 极弱环境贴图（仅给 PBR sheen）
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.18;

// 地面 — 接收阴影，颜色跟背景底部融合（infinite floor）
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({
    color: 0xeef0f2, roughness: 1.0, metalness: 0.0
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2.0;
ground.receiveShadow = true;
scene.add(ground);

// ---------- 占位物件（step 1 用来验证打光）----------
const group = new THREE.Group();

// 白色哑光球 — 验证 smooth shading
const whiteMat = new THREE.MeshStandardMaterial({
  color: 0xf0f0f0, roughness: 0.72, metalness: 0.0
});
const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.9, 64, 64), whiteMat);
sphere.position.set(-2.4, 0, 0);
sphere.castShadow = true;
sphere.receiveShadow = true;
group.add(sphere);

// 蓝色发光球 — 验证 emissive 不溢色
const blueMat = new THREE.MeshStandardMaterial({
  color: 0x0040ff, roughness: 0.45, metalness: 0.0,
  emissive: 0x002299, emissiveIntensity: 0.6
});
const blueSphere = new THREE.Mesh(new THREE.SphereGeometry(0.9, 64, 64), blueMat);
blueSphere.position.set(0, 0, 0);
blueSphere.castShadow = true;
group.add(blueSphere);

// 白色立方体 — 验证平面接受光
const cube = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 1.3), whiteMat);
cube.position.set(2.4, 0.65, 0);
cube.rotation.y = Math.PI * 0.18;
cube.castShadow = true;
cube.receiveShadow = true;
group.add(cube);

// 一片薄"平台" — 呼应你的 piattaforma_white 模型
const platform = new THREE.Mesh(
  new THREE.BoxGeometry(8, 0.25, 4),
  whiteMat
);
platform.position.y = -1.6;
platform.receiveShadow = true;
group.add(platform);

// 蓝色细连线 — 呼应参考图里的电缆
const lineMat = new THREE.MeshStandardMaterial({
  color: 0x0040ff, emissive: 0x0040ff, emissiveIntensity: 0.35,
  roughness: 0.6, metalness: 0.0
});
const line = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 4.5, 12), lineMat);
line.position.set(-1.4, -1.4, 0);
line.rotation.z = Math.PI / 2;
line.castShadow = true;
group.add(line);

scene.add(group);

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
controls.minDistance = 4;
controls.maxDistance = 30;

// ---------- Resize ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Loop ----------
function tick() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
