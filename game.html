<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLB 100 Family Day — Game Page</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #viewport { position: absolute; inset: 0; }
  #tag {
    position: absolute; top: 14px; left: 14px; z-index: 10;
    background: rgba(255,255,255,0.75); backdrop-filter: blur(8px);
    padding: 8px 12px; border-radius: 8px; font-size: 12px; color: #2a2a2a;
    border: 1px solid rgba(0,0,0,0.06); letter-spacing: 0.3px;
  }
  #tag b { color: #0040ff; }
  #hint {
    position: absolute; bottom: 14px; left: 14px; z-index: 10;
    font-size: 11px; color: #888; letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div id="viewport"></div>
<div id="tag">step <b>4</b> / n &nbsp;·&nbsp; loading GLB…</div>
<div id="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('viewport').appendChild(renderer.domElement);

// ---------- Scene ----------
const scene = new THREE.Scene();

// 背景：摄影棚软光影 — 三层叠加
function makeGradientBg() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#d6dade';
  ctx.fillRect(0, 0, 1024, 1024);
  const glow = ctx.createRadialGradient(512, 620, 60, 512, 620, 820);
  glow.addColorStop(0.00, 'rgba(252, 253, 254, 1.00)');
  glow.addColorStop(0.35, 'rgba(238, 241, 244, 0.55)');
  glow.addColorStop(0.75, 'rgba(214, 218, 222, 0.10)');
  glow.addColorStop(1.00, 'rgba(214, 218, 222, 0.00)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, 1024, 1024);
  const haze = ctx.createLinearGradient(0, 0, 0, 1024);
  haze.addColorStop(0.00, 'rgba(150, 158, 166, 0.18)');
  haze.addColorStop(0.45, 'rgba(150, 158, 166, 0.00)');
  haze.addColorStop(1.00, 'rgba(255, 255, 255, 0.06)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, 0, 1024, 1024);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}
scene.background = makeGradientBg();
scene.fog = new THREE.Fog(0xd6dade, 22, 80);

// ---------- Camera ----------
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(7, 5, 9);
camera.lookAt(0, 0, 0);

// ---------- Lights（建筑白模 — 软影棚拍，有轮廓）----------
const hemi = new THREE.HemisphereLight(0xffffff, 0xe8ebee, 1.0);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0xffffff, 0.42);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xffffff, 1.25);
key.position.set(40, 100, 50);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 400;
key.shadow.bias = -0.0005;
key.shadow.radius = 6;
key.shadow.blurSamples = 25;
scene.add(key);
// 后面 fitToObject 会按模型尺寸重写 shadow.camera 边界

const fill = new THREE.DirectionalLight(0xffffff, 0.2);
fill.position.set(-60, 40, -30);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.35);
rim.position.set(-30, 60, -80);
scene.add(rim);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.22;

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
controls.minDistance = 4;
controls.maxDistance = 600;

// ---------- Load GLB ----------
const tagEl = document.getElementById('tag');
let model = null;
const loader = new GLTFLoader();
loader.load(
  'piattaforma_white.glb',
  (gltf) => {
    model = gltf.scene;
    model.traverse(o => {
      if (o.isMesh) {
        o.castShadow = true;
        o.receiveShadow = true;
        if (o.material) o.material.envMapIntensity = 0.5;
      }
    });
    scene.add(model);
    fitToObject(model);

    const box = new THREE.Box3().setFromObject(model);
    const sz = box.getSize(new THREE.Vector3());
    tagEl.innerHTML = `step <b>4</b> / n &nbsp;·&nbsp; GLB loaded — ${sz.x.toFixed(1)} × ${sz.y.toFixed(1)} × ${sz.z.toFixed(1)}`;
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
      tagEl.innerHTML = `step <b>4</b> / n &nbsp;·&nbsp; loading GLB… ${pct}%`;
    }
  },
  (err) => {
    console.error('GLB load failed:', err);
    tagEl.innerHTML = `step <b>4</b> / n &nbsp;·&nbsp; GLB load failed`;
  }
);

// ---------- Fit camera + key light shadow camera to object ----------
function fitToObject(obj, padding = 1.45) {
  const box = new THREE.Box3().setFromObject(obj);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const center = sphere.center;
  const r = sphere.radius;

  const fov = camera.fov * (Math.PI / 180);
  const dist = (r / Math.sin(fov / 2)) * padding;

  // 3/4 高位 — 与参考图一致
  camera.position.set(
    center.x + dist * 0.65,
    center.y + dist * 0.50,
    center.z + dist * 0.78
  );
  camera.near = Math.max(0.05, dist / 200);
  camera.far  = dist * 40;
  camera.updateProjectionMatrix();

  controls.target.copy(center);
  controls.minDistance = dist * 0.25;
  controls.maxDistance = dist * 6;
  controls.update();

  // Key light shadow camera bounds — 包住模型 + 一点 padding
  const s = r * 1.6;
  key.shadow.camera.left   = -s;
  key.shadow.camera.right  =  s;
  key.shadow.camera.top    =  s;
  key.shadow.camera.bottom = -s;
  key.shadow.camera.near   = Math.max(0.1, dist / 10);
  key.shadow.camera.far    = dist * 6;
  key.shadow.camera.updateProjectionMatrix();
}

// ---------- Resize ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Loop ----------
function tick() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
